name: Deploy AXIOM Infrastructure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  provision-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan -out=tfplan \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -var="client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -var="client_secret=${{ secrets.AZURE_CLIENT_SECRET }}" \
            -var="custom_domain=${{ secrets.AXIOM_DOMAIN }}"

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Capture Terraform outputs
        id: tf_outputs
        working-directory: terraform
        run: |
          echo "swa_token=$(terraform output -raw static_web_app_deployment_token)" >> "$GITHUB_OUTPUT"
          echo "static_web_default_host=$(terraform output -raw static_web_default_hostname)" >> "$GITHUB_OUTPUT"

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: axiom-web
          path: |
            axiom_web_interface.html

    outputs:
      swa_token: ${{ steps.tf_outputs.outputs.swa_token }}
      static_web_default_host: ${{ steps.tf_outputs.outputs.static_web_default_host }}

  deploy-web:
    runs-on: ubuntu-latest
    needs: provision-infrastructure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: axiom-web

      - name: Deploy AXIOM static site
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ needs.provision-infrastructure.outputs.swa_token }}
          action: upload
          app_location: /
          app_artifact_location: /
          skip_app_build: true

  post-deploy-summary:
    runs-on: ubuntu-latest
    needs: [provision-infrastructure, deploy-web]
    steps:
      - name: Deployment summary
        run: |
          {
            echo "## AXIOM deployment summary"
            echo "- Terraform infrastructure: complete"
            echo "- Static Web App deployment: complete"
            echo "- Static Web hostname: ${{ needs.provision-infrastructure.outputs.static_web_default_host }}"
            echo "- DNS: CNAME records are managed by Terraform when create_dns_zone=true"
            echo "- HTTPS/SSL: Azure Static Web Apps managed certificates are enabled automatically after domain validation"
            echo "- Monitoring/logging: Log Analytics + Application Insights + diagnostics configured by Terraform"
          } >> "$GITHUB_STEP_SUMMARY"
