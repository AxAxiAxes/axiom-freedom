name: Deploy AXIOM Infrastructure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  provision-infrastructure:
    runs-on: ubuntu-latest
    env:
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_client_id: ${{ secrets.AZURE_CLIENT_ID }}
      TF_VAR_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
      TF_VAR_custom_domain: ${{ secrets.AXIOM_DOMAIN }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure CLI login
        run: |
          az login --service-principal \
            --username "$ARM_CLIENT_ID" \
            --password "$ARM_CLIENT_SECRET" \
            --tenant "$ARM_TENANT_ID" \
            --output none
          az account set --subscription "$ARM_SUBSCRIPTION_ID"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Capture Terraform hostname
        id: tf_outputs
        working-directory: terraform
        run: |
          echo "static_web_default_host=$(terraform output -raw static_web_default_hostname)" >> "$GITHUB_OUTPUT"
          echo "static_web_app_name=$(terraform output -raw static_web_app_name)" >> "$GITHUB_OUTPUT"
          echo "resource_group_name=$(terraform output -raw resource_group_name)" >> "$GITHUB_OUTPUT"

      - name: Resolve deployment token from provisioned app
        id: deploy_token
        run: |
          token="$(az staticwebapp secrets list \
            --name '${{ steps.tf_outputs.outputs.static_web_app_name }}' \
            --resource-group '${{ steps.tf_outputs.outputs.resource_group_name }}' \
            --query properties.apiKey -o tsv)"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Stage static web content
        run: |
          mkdir -p site
          cp axiom_web_interface.html site/index.html

      - name: Deploy AXIOM static site
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.deploy_token.outputs.token }}
          action: upload
          app_location: site
          app_artifact_location: site
          skip_app_build: true

    outputs:
      static_web_default_host: ${{ steps.tf_outputs.outputs.static_web_default_host }}

  post-deploy-summary:
    runs-on: ubuntu-latest
    needs: [provision-infrastructure]
    steps:
      - name: Deployment summary
        run: |
          {
            echo "## AXIOM deployment summary"
            echo "- Terraform infrastructure: complete"
            echo "- Static Web App deployment: complete"
            echo "- Static Web hostname: ${{ needs.provision-infrastructure.outputs.static_web_default_host }}"
            echo "- DNS: CNAME records are managed by Terraform when create_dns_zone=true"
            echo "- HTTPS/SSL: Azure Static Web Apps managed certificates are enabled automatically after domain validation"
            echo "- Monitoring/logging: Log Analytics + Application Insights + diagnostics configured by Terraform"
          } >> "$GITHUB_STEP_SUMMARY"
